		<p id="four"><a href="number.html">거리를 걷다가 그는 붉은 천을 발견한다. 요모조모 살펴본다. 그 형태가 희한하게 느껴진다. 이상하다. 가오리연 같달까. 마름모꼴인가. 한 꼭지점에 꼬리가 둘 달려 있어. 그는 천을 접어 종이비행기를 만들어본다. 날려본다. 잘 날아가지 않는다. 그는 벤치에 앉아 내내 시도한다. 나는 그 모습을 바라보고 있다. 그만 날리세요. 그건 감싸는 용도입니다. 기러기보자기입니다. 이렇게 감싸는 거예요. 나는 왼손을 부리처럼 만들어본다. 천을 왼손목에 묶는다. 그는 내 손목을 만져본다. 멀리 날려보려 한다. 재차. 날아가나.</a></p>
