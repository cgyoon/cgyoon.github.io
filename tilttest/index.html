<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기울기 색상 변화</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            transition: background-color 0.1s ease;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: rgba(255,255,255,0.2);
            border: 2px solid #fff;
            color: gray;
            border-radius: 25px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            position: fixed;
            top:  10px;
            right: 10px;
        }
        .info { margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <button id="startBtn">센서 권한 허용하기</button>

    <script>
        const startBtn = document.getElementById('startBtn');
        const infoText = document.getElementById('infoText');

        function handleOrientation(event) {
            // 좌우 기울기(gamma: -90 ~ 90)와 앞뒤 기울기(beta: -180 ~ 180) 활용
            let gamma = event.gamma || 0; 
            let beta = event.beta || 0;

            // 각도 값을 0~360 색상(Hue) 값으로 변환
            let hue = Math.floor((gamma + 90) * (360 / 180));
            let lightness = Math.floor(50 + (beta / 3.6)); // 밝기 조절

            document.body.style.backgroundColor = `hsl(${hue}, 80%, ${lightness}%)`;
            infoText.innerText = `Hue: ${hue}°, Lightness: ${lightness}%`;
        }

        function initSensor() {
            // iOS 13+ 등 권한이 필요한 기기 대응
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            startBtn.style.display = 'none';
                        } else {
                            alert('센서 권한이 거부되었습니다.');
                        }
                    }).catch(console.error);
            } else {
                // 안드로이드 및 일반 기기
                window.addEventListener('deviceorientation', handleOrientation);
                startBtn.style.display = 'none';
            }
        }

        startBtn.addEventListener('click', initSensor);
    </script>
</body>
</html>
