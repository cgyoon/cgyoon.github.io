	<h1></h1>
	<dl>
		<dt>발행물의 제목은 타당한가?</dt>
		<dd>다른 이름과 차별화되는가? 영문 표기, 줄임말 등을 고려했는가?</dd>
		<dt>목차는 타당한가?</dt>
		<dd>위계가 명확한가? 너무 많거나 적지 않은가?</dd>

		<dd>내용을 충분히 대표하는가? 흥미를 끌만한가?</dd>
		<dt>글의 구조가 명확한가?</dt>
		<dd>두괄식으로 서술했는가? 논리적 오류는 없는가?</dd>
		<dt>글의 흐름이 자연스러운가?</dt>
		<dd>도입에서부터 마무리까지 점진적인가?</dd>
		<dt>이미지를 알맞게 사용했는가?</dt>
		<dd>썸네일 이미지가 내용을 대표하는가? 글과 이미지가 호응하는가?</dd>
		<dt>보충 설명이 필요한 부분이 있는가?</dt>
		<dd>전문 용어, 약어, 추가 이미지 등</dd>
